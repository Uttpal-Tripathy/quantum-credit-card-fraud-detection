# Quantum pipeline configuration. Consumed by src/quantum/*.
# backend: simulator | noisy_simulator | ibm_quantum
# Real hardware access requires IBM_QUANTUM_TOKEN in .env; the code falls
# back to the simulator with a warning if credentials/backend are unavailable.

quantum:
  backend: simulator
  qubits: 8
  shots: 1024
  feature_map: zz          # zz | z | pauli
  feature_map_reps: 2
  entanglement: linear      # linear | full | circular
  ansatz: real_amplitudes   # real_amplitudes | efficient_su2 | two_local
  ansatz_reps: 3
  optimizer: cobyla         # cobyla | spsa | l_bfgs_b
  optimizer_maxiter: 150
  qnn_type: estimator       # estimator | sampler
  random_seed: 42

noise:
  enabled: false
  depolarizing_prob_1q: 0.001
  depolarizing_prob_2q: 0.01
  readout_error_prob: 0.02
  thermal_relaxation: false

shots_sweep: [128, 256, 512, 1024, 2048]
qubit_sweep: [2, 4, 6, 8, 10, 12]

ibm_quantum:
  channel: ibm_quantum_platform
  instance: null            # e.g. "ibm-q/open/main" — set via .env or here
  default_backend: least_busy
  max_circuits_per_job: 50
